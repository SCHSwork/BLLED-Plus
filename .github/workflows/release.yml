name: Release
# When a new firmware file lands on main (releases/BLLC_V<version>.bin.ota, version taken from
# platformio.ini), publish it as a GitHub release, using releases/notes-v<version>.md as the text.
# A version that already has a release is left alone. Every release is signed with the
# BLLED_SIGNING_KEY secret, and .sig is attached next to the firmware.
on:
  push:
    branches: [main]
    paths: ['releases/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.BLLED_SIGNING_KEY }}
        run: |
          VER=$(sed -n 's/^custom_version *= *\([0-9.]*\).*/\1/p' platformio.ini)
          TAG="v${VER}"
          FILE="releases/BLLC_V${VER}.bin.ota"
          NOTES="releases/notes-${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          test -f "$FILE" || { echo "No $FILE yet - nothing to release"; exit 0; }
          test -f "$NOTES" || echo "BLLED Plus $TAG" > "$NOTES"
          LITE="releases/BLLC_V${VER}-lite.bin.ota"
          # Sizes: the lite edition must fit controllers on the original BLLED layout (1,310,720
          # bytes); the full edition the larger layout (1,966,080). Without a lite file, the one
          # file has to fit everyone.
          SIZE=$(stat -c %s "$FILE")
          if [ -f "$LITE" ]; then
            LSIZE=$(stat -c %s "$LITE")
            if [ "$LSIZE" -gt 1310720 ]; then echo "::error::$LITE is $LSIZE bytes - too big for the original layout (1310720)"; exit 1; fi
            if [ "$SIZE" -gt 1966080 ]; then echo "::error::$FILE is $SIZE bytes - too big for the larger layout (1966080)"; exit 1; fi
          elif [ "$SIZE" -gt 1310720 ]; then echo "::error::$FILE is $SIZE bytes - too big for controllers on the original layout and there's no -lite edition"; exit 1; fi
          # Sign: controllers only install updates signed with this key
          if [ -z "$SIGNING_KEY" ]; then echo "::error::The BLLED_SIGNING_KEY secret is missing - not publishing an unsigned release"; exit 1; fi
          umask 077; printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl ec -in "$RUNNER_TEMP/key.pem" -pubout 2>/dev/null > "$RUNNER_TEMP/pub.pem"
          # ...and make sure it's the key the firmware trusts (catches a wrong secret)
          WANT=$(grep -o '"[A-Za-z0-9+/=]\{20,\}' src/blled/signing_key.h | tr -d '"' | tr -d '\n')
          HAVE=$(grep -v '^-----' "$RUNNER_TEMP/pub.pem" | tr -d '\n')
          [ "$WANT" = "$HAVE" ] || { echo "::error::BLLED_SIGNING_KEY doesn't match the key in src/blled/signing_key.h"; exit 1; }
          for F in "$FILE" "$LITE"; do
            [ -f "$F" ] || continue
            openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out "$F.sig" "$F"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/pub.pem" -signature "$F.sig" "$F"
          done
          rm -f "$RUNNER_TEMP/key.pem"
          # Upload one file at a time, lite first: updaters before 2.8.20 take the first .ota and
          # first .ota.sig they see, and the lite edition installs on every controller.
          if [ -f "$LITE" ]; then
            gh release create "$TAG" "$LITE" --target "$GITHUB_SHA" --title "BLLED Plus $TAG" --notes-file "$NOTES" --latest
            gh release upload "$TAG" "$LITE.sig"
            gh release upload "$TAG" "$FILE"
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "BLLED Plus $TAG" --notes-file "$NOTES" --latest
          fi
          gh release upload "$TAG" "$FILE.sig"
