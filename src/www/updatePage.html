<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>BLLED OTA Update</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <canvas id="particleCanvas"></canvas>

    <div id="container">
        <div id="header">
            <img id="logo" src="/blled.svg" alt="BLLED Logo">
            <h1>Update firmware</h1>
        </div>

        <div class="form-container">
            <form enctype="multipart/form-data" id="upload_form" method="post">
                <label for="file1">Select .bin.ota File</label>
                <input accept=".ota,.bin,application/octet-stream" id="file1" name='firmware' type="file">
                <div id="otaBox" class="ota" hidden>
                    <div class="ota-top"><b id="otaPct">0%</b><span id="otaStep">Uploading</span></div>
                    <div class="ota-track"><div class="ota-fill" id="otaFill"></div></div>
                    <div class="ota-sub" id="otaSub">Starting...</div>
                    <ol class="ota-steps" aria-label="Steps">
                        <li data-step="upload">Upload</li><li data-step="install">Install</li><li data-step="restart">Restart</li><li data-step="done">Done</li>
                    </ol>
                    <small class="ota-hint">Keep this page open and the screen on. The light strip fills up as the file arrives.</small>
                </div>
                <progress id="progressBar" max="100" value="0" hidden></progress>
                <button id="button-send" type="submit" disabled>Update Firmware</button>

                <div style="margin-top: 10px;">
                    <button type="button" class="ghost" onclick="location.href='/'">Back</button>
                </div>
            </form>
            <p id="status">Status: Ready</p>
        </div>
    </div>

    <script src="particleCanvas.js"></script>
    <script>

        function alertToast(type, message) {
            const toast = document.getElementById("toast");
            const icon = document.getElementById("toast-icon");
            const msg = document.getElementById("toast-msg");

            let iconChar = "ℹ️";
            let color = "#333";

            switch (type.toLowerCase()) {
                case "success":
                    iconChar = "✅";
                    color = "#28a745";
                    break;
                case "error":
                    iconChar = "❌";
                    color = "#dc3545";
                    break;
                case "warning":
                    iconChar = "⚠️";
                    color = "#ffc107";
                    break;
                case "info":
                default:
                    iconChar = "ℹ️";
                    color = "#17a2b8";
            }

            toast.className = (type.toLowerCase() === "error") ? "error" : "";
            icon.textContent = iconChar;
            msg.textContent = message;

            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3000);
        }

        function _(el) { return document.getElementById(el); }

        // ---- Progress display ----
        let otaStart = 0, otaSize = 0, otaSeen = 0, otaPoll = null, rateHist = [], serverCounts = false;
        const mb = n => (n / 1048576).toFixed(2);
        function setStep(step) {
            const order = ['upload', 'install', 'restart', 'done'];
            const at = order.indexOf(step);
            document.querySelectorAll('.ota-steps li').forEach(li => {
                const i = order.indexOf(li.dataset.step);
                li.className = i < at ? 'done' : i === at ? 'now' : '';
            });
            _('otaStep').textContent = { upload: 'Uploading', install: 'Installing', restart: 'Restarting', done: 'Done' }[step];
        }
        function showBytes(n) {
            if (!otaSize || n < otaSeen) return;
            otaSeen = n;
            const p = Math.min(100, Math.floor(n * 100 / otaSize));
            _('otaPct').textContent = p + '%';
            _('otaFill').style.width = p + '%';
            const now = Date.now();
            rateHist.push([now, n]);
            while (rateHist.length > 2 && now - rateHist[0][0] > 15000) rateHist.shift();
            let left = '';
            if (rateHist.length > 1) {
                const [t0, n0] = rateHist[0];
                const rate = (n - n0) / Math.max(1, (now - t0) / 1000); // bytes per second
                if (rate > 0 && p < 100) {
                    const s = Math.round((otaSize - n) / rate);
                    left = s >= 90 ? ' · about ' + Math.round(s / 60) + ' min left' : ' · about ' + Math.max(5, Math.ceil(s / 5) * 5) + ' s left';
                }
            }
            _('otaSub').textContent = mb(n) + ' of ' + mb(otaSize) + ' MB' + left;
            if (p >= 100) { setStep('install'); _('otaSub').textContent = 'Checking and installing the new firmware...'; }
        }
        // What the controller has actually received: the browser's own count can run ahead
        function startPolling() {
            otaPoll = setInterval(() => {
                fetch('/api/ota', { cache: 'no-store' }).then(r => r.json()).then(d => {
                    if (!d.active && !d.bytes) return;
                    if (d.total) otaSize = d.total;
                    if (!serverCounts) { serverCounts = true; otaSeen = 0; rateHist = []; } // switch to the real count
                    showBytes(d.bytes);
                }).catch(() => {});
            }, 1500);
        }
        function stopPolling() { clearInterval(otaPoll); otaPoll = null; }

        // The version before the update, so the page can tell whether the new one actually installed
        let fwBefore = null, uploadedAll = false;
        fetch('/api/status').then(r => r.json()).then(d => fwBefore = d.fw).catch(() => {});

        // After an upload: wait for the controller to come back and report which version it runs.
        // This also catches an upload that went through but whose reply got lost in the restart.
        // After an upload: wait for the controller to actually restart (it goes quiet, or comes back
        // with a fresh uptime) and then report the version it runs. Rejoining Wi-Fi after a restart
        // can take 15-40 s, so this waits up to 2 minutes before deciding anything.
        function waitForRestart(afterError) {
            const started = Date.now();
            let sawDown = false, done = false;
            const finish = (fn) => { if (!done) { done = true; clearInterval(interval); fn(); } };
            const failed = (msg, toast) => {
                _('status').textContent = msg;
                _('otaBox').hidden = true; _('button-send').disabled = false; _('file1').disabled = false;
                alertToast("error", toast);
            };
            const interval = setInterval(() => {
                const waited = (Date.now() - started) / 1000;
                fetch('/api/status', { cache: 'no-store' })
                    .then(r => r.json())
                    .then(d => {
                        const restarted = sawDown || d.uptime < waited + 5;
                        if (!restarted) {
                            // Still running the old session. After a dropped connection with no
                            // restart in 20 s, the upload didn't get through.
                            if (afterError && waited > 20)
                                finish(() => failed("Upload failed: the connection dropped partway. Nothing changed (still on " + d.fw + ") - try again.", "Firmware upload failed!"));
                            else if (waited > 120)
                                finish(() => failed("Still on " + d.fw + " - the controller never restarted, so the update didn't install. Try again.", "Update didn't install"));
                            return;
                        }
                        finish(() => {
                            if (fwBefore && d.fw === fwBefore) {
                                failed("Still on " + d.fw + " after restarting - the update didn't install. Try again.", "Update didn't install");
                            } else {
                                setStep('done'); _('otaPct').textContent = '100%'; _('otaFill').style.width = '100%';
                                _('otaSub').textContent = 'Running ' + d.fw + '. Took ' + Math.round((Date.now() - otaStart) / 1000) + ' s.';
                                _('status').textContent = "Updated to " + d.fw + ".";
                                alertToast("success", "Updated to " + d.fw);
                                setTimeout(() => location.href = "/", 2500);
                            }
                        });
                    })
                    .catch(() => {
                        sawDown = true; // restarting or rejoining Wi-Fi
                        _('otaSub').textContent = 'Restarting and rejoining Wi-Fi... (' + Math.round(waited) + ' s)';
                        if (waited > 150)
                            finish(() => {
                                _('status').textContent = "The controller hasn't come back yet. Give it a minute, then open the status page.";
                                alertToast("error", "Device did not come back online.");
                            });
                    });
            }, 2500);
        }

        function uploadFile() {
            var file = _("file1").files[0];
            otaSize = file.size; otaSeen = 0; rateHist = []; otaStart = Date.now(); serverCounts = false;
            _('otaBox').hidden = false; setStep('upload');
            _('button-send').disabled = true; _('file1').disabled = true;
            startPolling();
            var formdata = new FormData();
            formdata.append("firmware", file, file.name);
            var ajax = new XMLHttpRequest();
            ajax.upload.addEventListener("progress", progressHandler, false);
            ajax.addEventListener("load", completeHandler, false);
            ajax.addEventListener("loadstart", startHandler, false);
            ajax.addEventListener("error", errorHandler, false);
            ajax.addEventListener("abort", abortHandler, false);
            ajax.open("POST", "/update");
            ajax.setRequestHeader("X-BLLED", "1");
            ajax.send(formdata);
        }

        function progressHandler(event) {
            var percent = Math.round((event.loaded / event.total) * 100);
            _("progressBar").value = percent;
            if (percent >= 100) uploadedAll = true;
            // The browser's own count is only a stand-in until the controller reports what it has
            // received; phones report the whole file as sent long before it has really arrived.
            if (!serverCounts && percent < 100) showBytes(Math.round(event.loaded / event.total * otaSize));
        }

        function completeHandler(event) {
            _("progressBar").value = 0;
            stopPolling();
            const x = event.target;
            if (x && x.status && x.status !== 200) {
                _('otaBox').hidden = true; _('button-send').disabled = false; _('file1').disabled = false;
                _('status').textContent = x.responseText || ("Update failed (" + x.status + ").");
                alertToast("error", "Update failed");
                return;
            }
            showBytes(otaSize); setStep('restart'); _('otaSub').textContent = 'Restarting into the new version...';
            _('status').textContent = "Upload complete. Restarting...";
            alertToast("success", "Firmware uploaded");
            waitForRestart();
        }

        function startHandler(event) {
            _('status').textContent = "Uploading...";
            alertToast("info", "Uploading firmware...");
        }

        function errorHandler(event) {
            stopPolling();
            // The connection dropped. That can also happen when the update went through and the
            // controller restarted before its reply arrived, so check which version it's running.
            _('status').textContent = "The connection dropped. Checking whether the update installed...";
            waitForRestart(true);
        }

        function abortHandler(event) {
            _('status').textContent = "Upload aborted.";
            alertToast("warning", "Firmware upload aborted.");
        }


        _('upload_form').addEventListener('submit', (e) => {
            e.preventDefault();
            uploadFile();
        });

        _('file1').addEventListener('change', function (e) {
            _('button-send').disabled = !_("file1").files.length;
            _('progressBar').value = 0;
            _('status').textContent = "Firmware Upload!";
        });
    </script>
    <div id="toast"><span id="toast-icon">ℹ️</span><span id="toast-msg">Placeholder</span></div>
</body>

</html>
