plugins { id 'com.android.application' }

android {
    namespace 'com.lincoln.blled'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lincoln.blled'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
