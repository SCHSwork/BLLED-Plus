<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLLED</title>
<style>
  :root { --bg:#1f262e; --surface:#28313b; --raised:#323c47; --line:#3d4854; --ink:#edf1f4; --muted:#9ba8b5; --accent:#8fc8f5; --on-accent:#0f2233; --bad:#ff7a70;
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", Roboto, system-ui, sans-serif; font-size: 15px; line-height: 1.45; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --bg:#e6eaee; --surface:#fff; --raised:#f1f4f7; --line:#d4dbe2; --ink:#1c242c; --muted:#5c6874; --accent:#1f6fb2; --on-accent:#fff; --bad:#c53a2f; color-scheme: light; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px 20px 48px; }
  .strip { height: 22px; border-radius: 999px; background: var(--raised); box-shadow: 0 0 0 1px var(--line) inset; margin-bottom: 28px; }
  .strip.on { background: #22e0ee; box-shadow: 0 6px 34px -4px #22e0ee, 0 0 70px -10px #22e0ee; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  h1 { font-size: 26px; line-height: 1.15; margin: 0 0 8px; }
  p { margin: 0 0 22px; color: var(--muted); }
  p.err { color: var(--bad); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; font: inherit; padding: 12px 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
  button { width: 100%; font: inherit; font-weight: 650; padding: 13px 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); }
  small { display: block; color: var(--muted); margin-top: 18px; font-size: 13px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .strip.on { animation: none; } }
</style>
</head>
<body>
  <div class="strip" id="strip"></div>
  <h1 id="title">Connect to your controller</h1>
  <p id="msg">Enter the address shown on the controller's Wi-Fi setup page or in your router.</p>
  <form id="f">
    <label for="host">Controller address</label>
    <input id="host" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="192.168.68.53">
    <button type="submit" id="go">Connect</button>
  </form>
  <small>Your phone needs to be on the same Wi-Fi as the controller.</small>
<script>
  const failed = location.search.includes('failed');
  const host = window.BLLEDApp ? BLLEDApp.getHost() : '';
  document.getElementById('host').value = host;
  if (failed) {
    document.getElementById('title').textContent = 'Can’t reach the controller';
    const m = document.getElementById('msg');
    m.textContent = 'Nothing answered at ' + host + '. Check that the controller is powered and on this Wi-Fi, or change the address below.';
    m.className = 'err';
    document.getElementById('go').textContent = 'Try again';
  }
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    document.getElementById('strip').className = 'strip on';
    document.getElementById('go').textContent = 'Connecting…';
    if (window.BLLEDApp) BLLEDApp.connect(document.getElementById('host').value);
  });
</script>
</body>
</html>
